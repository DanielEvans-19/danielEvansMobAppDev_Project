<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      G00473365
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!--Fab button content-->
  <ion-grid>
    <ion-row>
      <ion-col offset="11">
        <ion-fab>
          <ion-fab-button>
            <ion-icon name="heart"></ion-icon>
          </ion-fab-button>
        </ion-fab>
      </ion-col>

      <ion-col>
        <ion-fab>
          <ion-fab-button>
            <ion-icon name="cog"></ion-icon>
          </ion-fab-button>
        </ion-fab>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div>
    <ion-card id="container_Left">
      <ion-card-header>
        <ion-card-title>Enter Ingredients</ion-card-title>
        <ion-card-subtitle>Multiple values entered below should be separated by a comma</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <!-- Replace this with text input field -->
        <ion-input id="ionicInput" value="potatoes,carrots,beans,etc."></ion-input>
      </ion-card-content>
    </ion-card>

    <!-- Put button here -->
    <ion-button id="buttonSearch">
      Search
    </ion-button>
  </div>

</ion-content>
